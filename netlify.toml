[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"

# Area x service URLs that have no page (e.g. /areas/slough/after-events/)
# 301 to their area page. Rules are not forced, so a file that exists (the
# area page itself, and any service x town page listed in PUBLISHED_COMBOS in
# src/lib/comboContent.js) is always served instead of being redirected.

[[redirects]]
  from = "/areas/slough/*"
  to = "/areas/slough/"
  status = 301

[[redirects]]
  from = "/areas/windsor/*"
  to = "/areas/windsor/"
  status = 301

[[redirects]]
  from = "/areas/maidenhead/*"
  to = "/areas/maidenhead/"
  status = 301

[[redirects]]
  from = "/areas/langley/*"
  to = "/areas/langley/"
  status = 301

[[redirects]]
  from = "/areas/ascot/*"
  to = "/areas/ascot/"
  status = 301

[[redirects]]
  from = "/areas/eton/*"
  to = "/areas/eton/"
  status = 301

[[redirects]]
  from = "/areas/burnham/*"
  to = "/areas/burnham/"
